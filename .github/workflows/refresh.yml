name: Refresh official data

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # build.mjs writes data/ only when a value changed, so an unchanged
      # upstream leaves the working tree clean and nothing is committed.
      - name: Rebuild data from upstream sources
        shell: bash
        run: node scripts/build.mjs 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show changes
        run: git diff --stat -- data

      # Pushes made with GITHUB_TOKEN do not trigger ci.yml, so the suites run here.
      - name: Test
        run: |
          npm test
          php php/test.php
          python -m unittest discover -s python

      - name: Commit if official data changed
        run: |
          if git diff --quiet -- data; then
            echo "Upstream data unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git commit -m "Refresh official data ($(date -u +%Y-%m-%d))"
          git push || { git pull --rebase && git push; }

      # Warnings from the build (newer iso-codes release, World Bank drift)
      # go into one "Data refresh needs review" issue; a clean run closes it.
      - name: Report warnings
        run: node scripts/refresh-report.mjs "$RUNNER_TEMP/build.log" --issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report a failed run
        if: failure()
        run: |
          {
            echo "The weekly refresh failed, so \`data/\` was not updated. The last lines of the build:"
            echo
            echo '```'
            tail -n 30 "$RUNNER_TEMP/build.log" 2>/dev/null || echo "(no build output)"
            echo '```'
            echo
            echo "Failed run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "This issue closes itself after the next run without warnings."
          } > "$RUNNER_TEMP/body.md"
          node scripts/github-issue.mjs upsert --topic data-refresh --title "Data refresh failed" --body-file "$RUNNER_TEMP/body.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GitHub disables scheduled workflows after 60 days without repository activity.
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        run: |
          curl -fsS -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/refresh.yml/enable"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
